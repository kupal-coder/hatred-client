name: Build Hatred Debug APK

on:
  workflow_dispatch:
  push:
    branches: [feat/hatred-evil-rebrand, feat/infinite-session, main]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools, CMake, NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=3.22.1" >> "$GITHUB_ENV"

      - name: Stub google-services.json (real Firebase file is gitignored)
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "0", "project_id": "hatred-stub", "storage_bucket": "hatred-stub.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:0:android:000000000000", "android_client_info": {"package_name": "com.project.lumina.client"}},
              "oauth_client": [],
              "api_key": [{"current_key": "STUB"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hatred-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
